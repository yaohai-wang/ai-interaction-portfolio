  - id: home-intro
    type: hero
    case: ideal-home
    eyebrow: 01 / 理想之家
    title: 把今天做的小事，接到自己的房间里。
    lead: 用愿景组织行动，由用户核对后计分，再兑换和布置家具。
    detail: 设计问题：自然语言记录怎样成为清楚、可控的行动反馈？
    meta:
      - label: 项目性质
        value: 个人生活产品 / Web Demo
      - label: 我的工作
        value: 独立设计与开发
      - label: 完成状态
        value: 真实AI整理、确认计分、购买与个人房间已串联实测
    demo: https://home.youkai-ou.com/
    qr: /qr/ideal-home.svg
    shots:
      - src: /revised/home/19-room-after.jpg
        label: ""
        caption: 独立测试存档：已确认两项行动，并购买、摆放一盆仙人掌。
    source: 2026-11-12独立测试存档；浏览器本地保存。UI名为「理想生活」，线上未启用房间图片生成。
  - id: home-hypotheses
    type: decision
    case: ideal-home
    eyebrow: 01 / 问题与设计假设
    title: 愿景、空间和确认，各解决一个具体问题。
    lead: 以下是从现有设计提出的可检验假设，不是用户访谈结论。
    items:
      - title: 先有愿景，行动才有参照。
        text: 愿景为行动分类提供方向，但增加首次使用成本。本轮测试中，无愿景先写手记，去完善愿景再返回，原输入逐字保留。
        label: 已验证：草稿保留。仍需观察：首次使用者能否理解这项前置要求。
      - title: 房间提供可见反馈，不承诺长期动力。
        text: 把积分换成可自行选择和摆放的家具，让记录之外还有一个可操作的反馈对象。现有材料不能证明它提升留存。
        label: 验证任务：理解积分来源，兑换一件家具，在自己的房间找到变化。
      - title: 确认的是“是否做过、关联什么”。
        text: 若整理把计划当成完成，或把一件事拆成多件，用户需要保留、取消候选，再决定保存。核对负担应集中在这些判断。
        label: 设计假设：逐条可见比一次接受整段分析更容易发现错误。
    source: 问题定义属于设计假设；功能与操作以实际界面为准。
  - id: home-journal
    type: focus
    case: ideal-home
    eyebrow: 01 / 手记与核对
    title: 核对候选后，只保存这次确认过的行动。
    lead: 同一合成手记包含已完成、未完成与生活小事；真实模型生成三个候选。
    shots:
      - src: /revised/home/08-vision-saved-focus.jpg
        label: 对应愿景
        caption: 已保存目标包含“完成交互设计作品集”。
      - src: /revised/home/11-real-candidates-focus.jpg
        label: 模型候选
        caption: 流程图8点、截图6点、做饭3点；尚未完成的读书未被提取为候选。
      - src: /revised/home/12-selection-reviewed-focus.jpg
        label: 人工选择
        caption: 取消做饭，只保留前两项，预览从17点变为14点。
    items:
      - title: 确认前可以保留或取消
        text: 勾选结果和积分预览对应，再点击保存；没有把候选自动记为完成。
        label: ""
      - title: 这次核对的边界
        text: 面板不支持直接编辑模型类别；当前分类仍需更多样例检查。
        label: ""
    source: 2026-11-12真实模型请求与UI操作；合成输入、同一愿景与同一浏览器存档。
    supportShots:
      - src: /revised/home/09-journal-input-focus.jpg
        label: 本次输入
        caption: 独立存档中的合成测试文本，不是本人经历陈述。
  - id: home-room
    type: sequence
    case: ideal-home
    eyebrow: 01 / 积分与空间反馈
    title: 本次获得14点，兑换后在自己的房间看到变化。
    lead: 初始赠送300点 + 本次确认14点 − 仙人掌20点 = 余额294点。
    shots:
      - src: /revised/home/13-confirmed-points-detail.jpg
        label: 01 / 确认后保存
        caption: 两项行动确认保存，累计成长新增14点，余额到314点。
      - src: /revised/home/16-purchased-focus.jpg
        label: 02 / 兑换家具
        caption: 花20点买入晴天仙人掌，余额294点。包含初始赠送，非本次行动独力支付。
      - src: /revised/home/19-room-after-focus.jpg
        label: 03 / 摆进自己的房间
        caption: 同一存档实际摆放仙人掌；不是预设样板间。
    source: 2026-11-12独立测试存档；合成行动输入，实际模型输出与实际购买/摆放。
    items:
      - title: 账务与空间各有证据
        text: 行动记录、购买价格、余额和家具库存逐项核对；样板间只作为体验入口。
        label: ""
  - id: home-recovery
    type: sequence
    case: ideal-home
    eyebrow: 01 / 异常与恢复
    title: 断网后查询原结果，放弃时不把候选计入积分。
    lead: 第二段测试手记被服务接收后，主动断开浏览器网络；恢复后沿用原任务查询。
    shots:
      - src: /revised/home/21-offline-unknown-detail.jpg
        label: 01 / 结果未知
        caption: 真实离线故障注入；显示“结果还未确认”和查询入口，仍有英文错误文本。
      - src: /revised/home/22-after-query-detail.jpg
        label: 02 / 找回候选
        caption: 网络恢复后查询同一请求，获得6点候选；尚未保存，不计分。
      - src: /revised/home/23-abandoned-input-focus.jpg
        label: 03 / 主动放弃
        caption: 返回输入重新整理，原文保留；放弃这次候选后余额仍294点。
    items:
      - title: 保存与放弃不会被旧响应重新激活
        text: 这次实测覆盖未知→查询→放弃；已保存状态见上一页。迟到响应保护来自现有机制，未做并发乱序实测。
        label: ""
    source: 2026-11-12真实网络故障注入；无伪造返回。恢复与不计分已实测，错误文案仍需改进。
  - id: home-iteration
    type: before-after
    case: ideal-home
    eyebrow: 01 / 方案迭代与检查
    title: 保留进入方式，把文字和可操作场景分开。
    lead: 旧版与新版都可进入房间；变化集中在入口构图与视觉层级。
    shots:
      - src: /shots/home/history-97bd65f-welcome.jpg
        label: 旧版
        caption: 真实历史版本：玻璃文案卡片覆盖全屏小屋场景。
      - src: /shots/home/welcome.jpg
        label: 新版
        caption: 真实运行版本：左侧文字、右侧可拖动浮岛。
    items:
      - title: 旧版观察
        text: 文案与按钮覆在场景上，左侧小屋细节被卡片遮挡。
        label: ""
      - title: 这次改变
        text: 去掉玻璃卡片，拆开文案和场景，保留语言、进入与跳过。
        label: ""
      - title: 选择依据
        text: 现有任务稿明确了目标构图与改动边界；不触碰室内功能。
        label: ""
      - title: 检查结果
        text: 历史归档和当前页面均可截图对照；没有转化或偏好测试结果。
        label: ""
    callout: AI 辅助过程并入本页：提供原型与目标图 → 约束保留功能 → 实现浮岛 → 检查拖动、语言与入口。
    source: 历史版本、本地任务文档与运行截图；不把工具提交记录等同于个人全部贡献。
  - id: agent-intro
    type: hero
    case: agent
    eyebrow: 02 / TASTETWIN
    title: 从餐食建议到实际摄入，让状态各自清楚。
    lead: 推荐是候选，计划是打算吃，记录是用户确认已经吃过。
    detail: 交互任务：推荐的一份餐食，如果实际只吃了半份，应怎样记录？
    meta:
      - label: 项目性质
        value: 饮食管理交互原型
      - label: 实现边界
        value: 本地规则识别与示例菜品；未接入真实模型调用
      - label: 本次展示
        value: 条件核对、计划与记录确认
    shots:
      - src: /revised/tastetwin/04-recommendations-full.jpg
        label: ""
        caption: 本地规则原型 · 示例菜品；同一次任务从推荐进入计划。
    source: 本地规则原型 · 示例数据；本轮仅验证交互与账务，不代表健康建议或真实模型匹配。
  - id: agent-states
    type: flow
    case: agent
    eyebrow: 02 / 状态关系
    title: 加入计划不增加摄入，确认吃过才更新合计。
    lead: 把“打算做”和“已经做”分开，避免把推荐值直接写成实际值。
    nodes:
      - title: 餐食建议
        detail: 可检查的候选
        kind: default
      - title: 加入计划
        detail: 还没有计入已吃
        kind: default
      - title: 核对实际份量
        detail: 餐次与数量
        kind: human
      - title: 确认记录
        detail: 更新实际摄入
        kind: human
    shots:
      - src: /revised/tastetwin/06-planned-totals-nutrition.jpg
        label: 已加入计划
        caption: 已吃1344、计划260、预计1604 kcal。加入计划没有增加实际摄入。
      - src: /revised/tastetwin/09-result-totals-nutrition.jpg
        label: 确认半份后
        caption: 已吃1474、未吃计划0、预计1474 kcal；列表中的已记录计划仍保留。
    source: 同一次本地规则原型任务 · 全部数值为示例数据。
    callout: 示例基线为1344 kcal。只有确认实际半份，才增加130 kcal；计划列表的存在不等于它仍计入未吃合计。
  - id: agent-conditions
    type: focus
    case: agent
    eyebrow: 02 / 条件理解与修正
    title: 把识别出的条件摆出来，让用户能检查和修改。
    lead: 实际输入“清淡鸡肉，20分钟内”；识别后改选鱼虾和15分钟内，档案限制保持原样。
    shots:
      - src: /revised/tastetwin/02-parsed-full.jpg
        label: 定位图
        caption: 右侧为本次条件操作区。
      - src: /revised/tastetwin/02-parsed-focus.jpg
        label: 规则识别后
        caption: 原输入与清淡、鸡肉、20分钟内对应；上海、过敏与忌口来自档案。
      - src: /revised/tastetwin/03-corrected-focus.jpg
        label: 手动修改后
        caption: 鱼虾和15分钟内成为选中项；原输入气泡仍保留。
    items:
      - title: 档案与本次要求分开
        text: 顶部带入档案限制，下方是当前要求及可选标签。
      - title: 这次能证明什么
        text: 验证了规则识别和手动改选；当前标签并未驱动完整的推荐匹配。
    source: 本地规则原型 · 示例数据；完整场景仅定位，关键操作使用同帧局部。
  - id: agent-confirm
    type: sequence
    case: agent
    eyebrow: 02 / 实际份量与记录确认
    title: 计划一份、实际半份，按吃过的份量记账。
    lead: 进入确认后再选择实际餐次与份量；确认前后合计应该对应。
    shots:
      - src: /revised/tastetwin/05-plan-one-focus.jpg
        label: 01 / 计划一份
        caption: 炒饭1份为260 kcal，此时实际摄入尚未增加。
      - src: /revised/tastetwin/07-confirm-half-focus.jpg
        label: 02 / 核对实际份量
        caption: 选择晚餐、0.5份，再点击“确认记录”；选择本身不生效。
      - src: /revised/tastetwin/10-recorded-food-focus.jpg
        label: 03 / 已保存的晚餐
        caption: 保存详情为同一道炒饭0.5份、130 kcal。
      - src: /revised/tastetwin/09-result-kcal-focus.jpg
        label: 03 / 合计随记录更新
        caption: 已吃1474、计划0、预计1474 kcal。
    source: 同一任务、同一示例存档的实际操作；本地规则模拟，不是用户健康记录。
    variant: ledger
    callout: 1344（已有示例）+260×0.5=1474 kcal。当前计划行仍显示原计划1份，实际摄入以已保存的半份详情为准。
  - id: f1-intro
    type: hero
    case: pitwall
    eyebrow: 03 / 围场智析
    title: 页面名称是线索，可用证据才决定回答范围。
    lead: 法拉利页提供本页、全站、联网；首页只提供联网。两者的证据输入不同。
    detail: 设计问题：如何让“我正在看哪里”与“助手实际能读什么”保持一致？
    meta:
      - label: 项目性质
        value: F1 信息产品 / 上下文助手
      - label: 本轮验证
        value: 两次真实请求成功，分别核对本页与联网范围
      - label: 能力边界
        value: 页面名称不等于整页已被读取
    demo: https://f1.youkai-ou.com/zh/home
    qr: /qr/pitwall.svg
    shots:
      - src: /revised/f1/evidence-scope.jpg
        label: 有页面证据
        caption: 法拉利车队页：默认“本页”，也可切换全站或联网。
      - src: /revised/f1/web-only-scope.jpg
        label: 仅有导航上下文
        caption: 围场首页：只允许联网，不提供本页证据。
    source: 2026-11-12 真实操作；页面范围与服务实际返回一致。
    variant: context
  - id: f1-evidence
    type: sequence
    case: pitwall
    eyebrow: 03 / 实际问答与能力边界
    title: 回答能追到证据，也要说清没有读到什么。
    lead: 问题摘要：法拉利在已保存快照中的名次、积分与数据时间。另在首页追问本页积分。
    shots:
      - src: /revised/f1/evidence-sources-detail.jpg
        label: 本页快照回答
        caption: 返回第2、510分；展开来源后可对应记录与2026-11-08 17:00 UTC数据时间。
      - src: /revised/f1/web-only-answer.jpg
        label: 首页能力边界
        caption: 先说明无法读取首页实时内容；原产品中的[1][2]为可点击引用，此处为截图。
    items:
      - title: 检查了对应关系
        text: 快照回答、来源记录与数据时间相符。仅验证此问题，不外推所有回答准确。
      - title: 保留时间区别
        text: 联网来源栏列出检索时间，发布日期显示未提供；方法页不能替代回答引用。
    source: 2026-11-12 两次真实请求；来源原文正确性未全面复核，快照不代表实时赛况。
    callout: 已验证两次回答及引用展示；服务失败与重试路径未复测，不据此声称整体可靠。
  - id: desktop
    type: desktop
    case: desktop
    eyebrow: 04 / 桌面平行宇宙
    title: 换主题时，保持用户正在查看的内容。
    lead: 木屋与文字入口打开同一项目；换主题后，已打开的面板和正文继续保留。
    shots:
