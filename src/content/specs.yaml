version: 1
reviewDate: '2026-11-12'
introduction:
  title: 从实现中重建交互规格。
  text: 流程、状态、组件与设计数值逐项回溯到现有代码。三份规格分别保留原型边界与产品限制，可单独浏览、打印，供后续整理进设计工具。
  note: 这是源码整理稿，不是既有 Figma 设计稿。表中的数值属于原产品；本页外壳使用作品集的自托管中文字体。
sheets:
  - id: tastetwin
    number: '01'
    title: TasteTwin
    subtitle: 建议、计划与已吃，是三件不同的事。
    accent: '#4d703b'
    repository: /Users/youkaiou/Desktop/Qloo/design/live-2d
    boundary: 本地交互原型，条件识别与推荐由示例规则模拟；未验证服务端大模型或自主 Agent 执行。
